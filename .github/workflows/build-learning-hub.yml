name: Build Learning Hub

on:
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate lesson notes, quizzes, labs and resources
        run: |
          python tools/build_notes.py
          python tools/build_quizzes.py
          python tools/build_labs.py
          python tools/build_resources.py

      - name: Validate JavaScript
        run: |
          find config js generated -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Validate local website assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  url = a.get('src') if tag == 'script' else a.get('href') if tag == 'link' and 'stylesheet' in a.get('rel', '').split() else None
                  if url:
                      u = urlsplit(url)
                      if not u.scheme and not u.netloc:
                          if not Path(u.path).is_file():
                              raise FileNotFoundError(url)
                          print('Found:', url)
          Assets().feed(Path('index.html').read_text(encoding='utf-8'))
          PY

      - name: Save generated website package
        uses: actions/upload-artifact@v6
        with:
          name: learning-hub-preview
          path: |
            index.html
            css/
            js/
            config/
            generated/
          if-no-files-found: error
          retention-days: 7
